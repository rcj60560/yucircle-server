spring:
  application:
    name: yucircle-backend
  datasource:
    url: jdbc:mysql://localhost:3306/yucircle?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      data-locations: classpath:init.sql

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: yucircle-secret-key-2026-badminton-community-very-long-key
  expiration: 86400000

# BWF 数据同步（设计见 doc/06）
bwf:
  sync:
    enabled: true            # 定时总开关（本地调试可关）
    point-sync-levels: major # 逐分只抓这些 level（逗号分隔；扩全站改这里）
